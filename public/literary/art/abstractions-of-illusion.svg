<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" class="literary-art material-print" data-piece="2" data-light-0="170 280 175" data-light-1="434 176 200" role="img" aria-labelledby="standalone2-material-67-title" aria-describedby="standalone2-material-67-desc">
<title id="standalone2-material-67-title">The observer within the veil</title><desc id="standalone2-material-67-desc">Unequal translucent sheets turn through space. Openings expose further layers; a faint human profile is formed by the cut edge of the nearest veil.</desc>
