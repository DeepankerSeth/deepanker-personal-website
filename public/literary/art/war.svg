<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" class="literary-art material-print" data-piece="1" data-light-0="236 220 175" data-light-1="344 260 125" role="img" aria-labelledby="standalone1-material-66-title" aria-describedby="standalone1-material-66-desc">
<title id="standalone1-material-66-title">Two roles, one material</title><desc id="standalone1-material-66-desc">Two incomplete ivory masks emerge from one buckled sheet, facing away from each other. One face breaks into unpressed paper; an unresolved seam joins their material.</desc>
